<!DOCTYPE html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <title>សារភាពស្នេហ៍</title>
    <style>
      body {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        text-align: center;
        font-family: "Khmer OS Siemreap", Arial, sans-serif;
        padding: 100px;
      }
      h1 {
        color: #d6336c;
        font-size: 40px;
        text-shadow: 2px 2px 4px #fff;
      }
      .heart {
        font-size: 80px;
        color: red;
        animation: beat 1s infinite;
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.3);
        }
      }
      p {
        font-size: 24px;
        color: #222;
        background: #fff3f3;
        display: inline-block;
        padding: 15px 25px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      .btn {
        font-size: 20px;
        margin: 15px;
        padding: 10px 25px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      .yes {
        background-color: #ff4d6d;
        color: white;
      }
      .yes:hover {
        background-color: #ff1a4d;
      }
      .no {
        background-color: #444;
        color: white;
      }
      .no:hover {
        background-color: #222;
      }
    </style>
  </head>
  <body>
    <div class="heart">❤️</div>
    <h1>សារភាពស្នេហ៍</h1>
    <p>បងស្រឡាញ់អូនយូរហើយ<br />ព្រមធ្វើសង្សាបងអត់អូនលីដា?</p>

    <div>
      <button class="btn yes" onclick="sayYes()">ចាស</button>
      <button class="btn no" onclick="sayNo()">អត់</button>
    </div>

    <h2 id="result"></h2>

    <script>
      function sayYes() {
        document.getElementById("result").innerHTML =
          "😍 ស្អែកទៅរៀបការយើង 💍❤️";
      }
      function sayNo() {
        document.getElementById("result").innerHTML = "🔥 ស្អែកដុតផ្ទះចោល 🏠";
      }
    </script>
  </body>
</html>
